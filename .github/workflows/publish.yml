# Publiceert het pakket naar GitHub Packages.
#
# Draait op een tag (v1.2.3) en met de hand via "Run workflow". Gebruikt de
# ingebouwde GITHUB_TOKEN, dus er hoeft geen persoonlijke sleutel in de repo te
# staan. De buildmachine van Vercel kan een privé git-dependency niet clonen —
# via een registry met een leestoken lukt dat wel.
name: Publiceren

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publiceren:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Vastgepind op een commit, niet op een label dat kan verschuiven
      # (supply chain, OWASP A03). Dependabot stelt nieuwe versies voor.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@resolvecreative'
      # Alleen een al bestaande versie mag doorlopen — elke andere fout hoort de
      # workflow rood te maken. Een kale `|| echo` verbergt ook een mislukte
      # publicatie, en dan denk je dat het pakket er staat terwijl dat niet zo is.
      - run: |
          uitvoer=$(npm publish 2>&1) && { echo "$uitvoer"; exit 0; }
          echo "$uitvoer"
          echo "$uitvoer" | grep -q 'EPUBLISHCONFLICT\|already exists' || exit 1
          echo 'Deze versie stond er al; niets te doen.'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
